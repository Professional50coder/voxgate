# Minimal on purpose. The database URL is NOT here: it comes from
# VOXGATE_DATABASE_URL at runtime via env.py, so a connection string with a
# password is never written to a file that gets committed.
[alembic]
script_location = %(here)s
prepend_sys_path = .
# Explicit, or alembic warns and falls back to splitting on spaces AND commas
# AND colons -- which mangles any Windows path containing a drive letter.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
