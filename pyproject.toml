[project]
name = "voxgate"
version = "0.1.0"
description = "Voice-driven durable workflow orchestrator (LangGraph + Pipecat)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    # Schema migrations. CREATE TABLE IF NOT EXISTS creates a schema; it does
    # not migrate one, so the first change that has to preserve data needs this.
    "alembic>=1.13",
    "exa-py>=2.16.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
# Voice stack. Heavy (models download on first use), so it is deliberately not
# part of the default install.
#
# Pinned <2 because PipelineTask and PipelineRunner are removed in 2.0.0.
# The >=0.0.60 floor this replaces was from the previous framework generation
# and silently resolved across a major version.
#
# Cartesia is the default voice when CARTESIA_API_KEY is set (human-sounding,
# fast first audio). Kokoro stays as the local fallback, so with no key or no
# network the agent still speaks and audio never has to leave the box.
voice = [
    "pipecat-ai[webrtc,websocket,whisper,kokoro,silero,groq,cartesia]>=1.7,<2",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "httpx>=0.27", "websockets>=12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxgate"]

# Vercel deployment: point the build at the top-level FastAPI app in app.py.
[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
# The voice interview processor is async, and every test of it is a coroutine.
# auto mode rather than a decorator on each: forgetting the marker makes a test
# pass by never running, which is the worst way for a test to be wrong.
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
